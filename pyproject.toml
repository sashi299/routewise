[project]
name = "routewise"
version = "0.1.0"
description = "Cost-aware, verified LLM routing for invoice extraction"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "black>=24,<26"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["routewise*", "backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
